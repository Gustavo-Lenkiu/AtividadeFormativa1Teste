name: CI

on: ['push', 'pull_request']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Instalar dependências
        run: npm install

      - name: Rodar build do React
        run: DISABLE_ESLINT_PLUGIN=true npm run build
    
      - name: Compactar pasta build em .zip
        run: |
          mkdir dist
          zip -r dist/projetozipado.zip build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: projetozipado
          path: dist/projetozipado.zip


  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Baixar artifact
        uses: actions/download-artifact@v4
        with:
          name: projetozipado

      - name: Listando conteúdo do artifact
        run: ls -R
