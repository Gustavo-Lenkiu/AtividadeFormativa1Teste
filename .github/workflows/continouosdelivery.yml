name: CI

on: ['push', 'pull_request']


jobs:
  delivery:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3


      - name: Instalar dependências
        run: npm install

      - name: Rodar build do React
        run: DISABLE_ESLINT_PLUGIN=true npm run build



      - name: Rodar build do React
        run: npm run build

      - name: Compactar pasta build em .zip
        run: |
          mkdir dist
          zip -r dist/projetozipado.zip build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: projetozipado
          path: dist/projetozipado.zip

  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        experimental: [false]
        runtime: [node]
        pm: [npm, yarn, pnpm]
    name: 👷 CI ${{ matrix.runtime }} on ${{ matrix.os }} with ${{ matrix.pm }}

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: Setup Test Environment
        uses: siguici/setup-js@v1
        with:
          runtime: ${{ matrix.runtime }}
          pm: ${{ matrix.pm }}

  deploy:
    runs-on: ubuntu-latest
    needs: delivery
    steps:
      - name: Baixar artifact
        uses: actions/download-artifact@v4
        with:
          name: projetozipado

      - name: Listando conteúdo do artifact
        run: ls -R
