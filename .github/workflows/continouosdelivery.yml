name: CI

on: ['push', 'pull_request']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Instalar dependências
        run: npm install

      - name: Rodar build do React
        run: DISABLE_ESLINT_PLUGIN=true npm run build

  delivery:
    runs-on: ubuntu-latest
    needs: build   # só roda se o build passar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Instalar dependências
        run: npm install

      - name: Rodar build do React
        run: DISABLE_ESLINT_PLUGIN=true npm run build

      - name: Compactar pasta build em .zip
        run: |
          mkdir dist
          zip -r dist/projetozipado.zip build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: projetozipado
          path: dist/projetozipado.zip

  deploy:
    runs-on: ubuntu-latest
    needs: delivery
    steps:
      - name: Baixar artifact
        uses: actions/download-artifact@v4
        with:
          name: projetozipado

      - name: Listando conteúdo do artifact
        run: ls -R
  
  create-pr:
    runs-on: ubuntu-latest
    needs: [build, delivery, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Criar Pull Request para main
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          base: main
          branch: ${{ github.ref_name }}
          commit-message: "Merge automático via GitHub Actions"
          title: "Atualização automática da branch ${{ github.ref_name }}"