name: CI

on: ['push', 'pull_request']

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Instalar dependências
        run: npm install

      - name: Rodar build do React
        run: DISABLE_ESLINT_PLUGIN=true npm run build

  delivery:
    runs-on: ubuntu-latest
    needs: build   # só roda se o build passar
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Instalar dependências
        run: npm install

      - name: Rodar build do React
        run: DISABLE_ESLINT_PLUGIN=true npm run build

      - name: Compactar pasta build em .zip
        run: |
          mkdir dist
          zip -r dist/projetozipado.zip build

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: projetozipado
          path: dist/projetozipado.zip

  test:
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.experimental }}
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest, windows-latest]
        experimental: [false]
        runtime: [node]
        pm: [npm, yarn, pnpm]
    name: 👷 CI ${{ matrix.runtime }} on ${{ matrix.os }} with ${{ matrix.pm }}

    steps:
      - name: 🚚 Checkout repository
        uses: actions/checkout@v4

      - name: Setup Test Environment
        uses: siguici/setup-js@v1
        with:
          runtime: ${{ matrix.runtime }}
          pm: ${{ matrix.pm }}

  deploy:
    runs-on: ubuntu-latest
    needs: delivery
    steps:
      - name: Baixar artifact
        uses: actions/download-artifact@v4
        with:
          name: projetozipado

      - name: Listando conteúdo do artifact
        run: ls -R
  merge:
    runs-on: ubuntu-latest
    needs: [build, delivery, test, deploy]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge para main
        run: |
          git fetch origin
          git checkout main
          git merge $GITHUB_REF_NAME --no-edit --allow-unrelated-histories
          git push origin main